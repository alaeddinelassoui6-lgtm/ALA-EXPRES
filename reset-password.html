<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f5b">
  <title>تغيير كلمة المرور - ALA EXPRESS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f3f6f5;
      font-family: Arial, sans-serif;
    }
    .box {
      width: 100%;
      max-width: 400px;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px #0001;
    }
    h2 { text-align: center; color: #087f5b; }
    p { line-height: 1.7; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #087f5b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="box">
    <h2>ALA EXPRESS 🚚</h2>
    <p>أدخل كلمة المرور الجديدة مرتين لتحديثها.</p>
    <form id="resetForm">
      <input id="password" type="password" placeholder="كلمة المرور الجديدة" minlength="8" required autocomplete="new-password">
      <input id="confirmPassword" type="password" placeholder="تأكيد كلمة المرور" minlength="8" required autocomplete="new-password">
      <button id="submitBtn" type="submit">حفظ كلمة المرور</button>
    </form>
    <p id="message" role="status"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://iqwabjdyshtvhnukylta.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pdCkpWQBZyrK_0loE6T7kw_80dH0SzB";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitBtn");

    async function prepareSession() {
      const hash = new URLSearchParams(location.hash.slice(1));
      const query = new URLSearchParams(location.search);
      const error = hash.get("error_description") || query.get("error_description");

      if (error) {
        message.textContent = "انتهت صلاحية رابط الاستعادة أو حدث خطأ. اطلب رابطًا جديدًا.";
        form.hidden = true;
        return;
      }

      const accessToken = hash.get("access_token");
      const refreshToken = hash.get("refresh_token");

      if (accessToken && refreshToken) {
        const { error } = await db.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });
        if (error) {
          message.textContent = "تعذر التحقق من الرابط. اطلب رابطًا جديدًا.";
          form.hidden = true;
          return;
        }
        history.replaceState(null, "", location.pathname);
      }

      const { data } = await db.auth.getSession();
      if (!data.session) {
        message.textContent = "افتح رابط الاستعادة الذي وصلك بالبريد الإلكتروني أولًا.";
        form.hidden = true;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent = "كلمة المرور يجب أن تتكون من 8 أحرف على الأقل.";
        return;
      }
      if (password !== confirmPassword) {
        message.textContent = "كلمتا المرور غير متطابقتين.";
        return;
      }

      button.disabled = true;
      message.textContent = "جارٍ حفظ كلمة المرور...";
      const { error } = await db.auth.updateUser({ password });

      if (error) {
        message.textContent = "تعذر تغيير كلمة المرور: " + error.message;
        button.disabled = false;
        return;
      }

      await db.auth.signOut();
      message.textContent = "تم تغيير كلمة المرور بنجاح. انتقل إلى لوحة الإدارة لتسجيل الدخول.";
      form.hidden = true;

      const link = document.createElement("a");
      link.href = "admin.html";
      link.textContent = "العودة إلى لوحة الإدارة";
      link.style.display = "block";
      link.style.marginTop = "15px";
      message.appendChild(document.createElement("br"));
      message.appendChild(link);
    });

    prepareSession();
  </script>
</body>
</html>
