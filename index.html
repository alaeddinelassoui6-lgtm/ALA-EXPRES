<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALA EXPRESS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    header {
      background: #087f5b;
      color: white;
      padding: 25px;
      border-radius: 15px;
    }
    .card {
      background: white;
      margin: 15px 0;
      padding: 20px;
      border-radius: 12px;
    }
    button {
      background: #087f5b;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <header>
    <h1>ALA EXPRESS 🚚</h1>
    <p>خدمات التوصيل ومتجر القناعة للألبسة النسائية</p>
  </header>

  <div class="card">
    <h2>📦 إرسال طرد</h2>
    <p>أرسل طردك بسهولة وأمان.</p>
    <button onclick="alert('قريبًا: خدمة إرسال الطرود')">اطلب الخدمة</button>
  </div>

  <div class="card">
    <h2>🛍️ شراء وتوصيل</h2>
    <p>اطلب منتجك ودعه يصل إلى باب منزلك.</p>
    <button onclick="alert('قريبًا: خدمة شراء المنتجات')">اطلب الآن</button>
  </div>

  <div class="card">
    <h2>🏪 خدمات التجار</h2>
    <p>خدمات توصيل الطرود والطلبات للتجار.</p>
  </div>

  <footer>
    <p>ALA EXPRESS — السرعة والثقة في خدمتكم</p>
  </footer>
</body>
</html>
